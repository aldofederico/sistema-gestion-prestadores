# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: sistema-gestion-prestadores
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-gestion-prestadores-db
          property: connectionString

databases:
  - name: sistema-gestion-prestadores-db
    plan: free
    region: virginia
    postgresMajorVersion: "18"
    databaseName: providers
    user: providers
    ipAllowList: []